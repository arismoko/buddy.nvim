site_name: buddy.nvim
site_description: Lua tools that work as keymaps AND as MCP tools
site_url: https://arismoko.github.io/buddy.nvim
repo_url: https://github.com/arismoko/buddy.nvim
repo_name: arismoko/buddy.nvim
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: https://raw.githubusercontent.com/neovim/neovim.github.io/master/logos/neovim-mark-flat.png

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Tools Reference: tools.md
  - Creating Tools: creating-tools.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arismoko/buddy.nvim
